# Benchmark experiment parameters, loaded by Lib/gripper_settings.py.
#
# This file is the experiment DESIGN: what is varied, how many times, and the
# timings of the sequences that collect it. How the gripper itself behaves -
# port, current range, calibration and slip tuning - lives beside this file in
# gripper_config.yaml.
#
# CHANGING THE MATRIX INVALIDATES COLLECTED DATA. The completion bookkeeping in
# matrix.py counts recorded rows per finger / padding / current, so renaming or
# removing a level orphans its existing rows in the CSV (they are ignored, not
# deleted), and adding one marks completed combinations incomplete again.

matrix:
  # One finger pair is printed per material and swapped between combinations.
  finger_materials: [PETG, PLA, ABS, TPU]

  # The compliant layer bonded to the finger face.
  paddings: ["No padding", "Rubber band", "Eraser", "Sponge"]

  # Goal current limits swept within every combination, in raw units.
  # 1 unit is about 2.69 mA, so 100-120 raw is roughly 269-323 mA.
  #
  # Deliberately an explicit list rather than a min/max/step: it keeps a
  # non-uniform sweep possible, and it stays distinct from the current: block
  # in gripper_config.yaml, which bounds the manual GUI's slider rather than
  # describing an experiment.
  currents: [100, 105, 110, 115, 120]

  # Measurements taken per combination at each current.
  repeats: 3

motion:
  # Profile velocity used for every open/close move during a run. Held constant
  # so grip force is the only variable under test.
  profile_velocity: 480

timing:
  # Let the kitchen scale settle before prompting for a reading (runner.py).
  scale_dwell: 1.0

  # The slip watch samples as fast as the bus allows; live readouts are
  # throttled to this so a Tk main loop can absorb them (slip.py).
  readout_interval: 0.1

  # How often a worker blocked on an operator prompt rechecks the shared abort
  # event (dialogs.py).
  abort_check_interval: 0.2

  # Live position readout rate during manual calibration step 1. In
  # milliseconds, because it is a Tk `after` delay (calibration_ui.py).
  manual_poll_ms: 200
