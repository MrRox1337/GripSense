<!--
  Mermaid support for the GitHub Pages build of README.md.

  github.com renders ```mermaid fences server-side. GitHub Pages does not: Jekyll
  hands the fence to kramdown, which emits <pre><code class="language-mermaid">
  and the diagram is served as plain source text. This include is pulled into
  <head> by the theme layout; it rewrites those blocks into the <pre class="mermaid">
  container mermaid looks for, then renders them in the browser.
-->
<style>
  pre.mermaid {
    background: transparent;
    border: 0;
    padding: 0;
    margin: 1.25rem 0;
    text-align: center;
    overflow-x: auto;
  }

  pre.mermaid svg {
    max-width: 100%;
    height: auto;
  }

  /*
    Hide the un-rendered source only once the script is confirmed to be running,
    so a blocked CDN or a mermaid error degrades to readable diagram source
    rather than to a blank gap.
  */
  .mermaid-pending pre.mermaid:not([data-processed]) {
    visibility: hidden;
  }
</style>

<script type="module">
  const blocks = document.querySelectorAll("pre > code.language-mermaid");

  if (blocks.length) {
    document.documentElement.classList.add("mermaid-pending");

    blocks.forEach(function (code) {
      const host = document.createElement("pre");
      host.className = "mermaid";
      // textContent undoes kramdown's HTML escaping, so "--&gt;" is handed to
      // mermaid as the "-->" it originally wrote in the README.
      host.textContent = code.textContent;
      code.parentElement.replaceWith(host);
    });

    try {
      const url = "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      const mermaid = (await import(url)).default;
      mermaid.initialize({ startOnLoad: false });
      await mermaid.run({ querySelector: "pre.mermaid" });
    } catch (error) {
      console.error("mermaid failed to render:", error);
    } finally {
      document.documentElement.classList.remove("mermaid-pending");
    }
  }
</script>
