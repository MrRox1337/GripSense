# GitHub Pages builds README.md into the project site with Jekyll.
#
# Pin the theme rather than leaning on the implicit default: _includes/head-custom.html
# is what renders the mermaid diagrams, and it is only pulled in if the active
# theme's layout carries the head-custom hook. primer does.
theme: jekyll-theme-primer

# Repository sources are not part of the published page. Excluding them keeps the
# build output to the rendered README.
exclude:
  - Config/
  - Lib/
  - Scripts/
  - requirements.txt
